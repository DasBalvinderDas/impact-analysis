[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-analysis-poc-target"
version = "0.1.0"
description = "Disposable billing application for the Change Impact Analysis Agent POC"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["billing_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
